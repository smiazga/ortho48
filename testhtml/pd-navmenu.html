<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="../Content/main-patientdirect.css" rel="stylesheet" />
    <link href="../Content/fontawesome-free-5.15.4-web/css/all.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</head>
<body>
    <div class="mobile-header" id="mobile-header">
        <button onclick="toggleSidebar()">&#9776;</button>
        <span class="ms-3"><i class="fas fa-image"></i> LOGO</span>
    </div>
    <aside id="sidebar">
        <div class="sidebar-header"><!-- <i class="fas fa-compress"></i> --><i class="fas fa-image"></i>LOGO</div>
        <div class="sidebar-title">Platform</div>
        <div class="accordion" id="platformAccordion">
            <div class="accordion-item">
                <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="false" aria-controls="collapseOne">
                        Choose a platform
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#platformAccordion">
                    <div class="accordion-body">
                        <a href="#"><i class="fas fa-image"></i> OrthoPacks</a>
                        <a href="#"><i class="fas fa-image"></i> Ortho Molecular Products</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="sidebar-title">My Account</div>
        <ul>
            <li><a href="#"><i class="fas fa-user-circle"></i> Tiger Woods</a></li>
        </ul>
        <div class="sidebar-title">Products</div>
        <ul>
            <li><a href="#"><i class="fas fa-list-check"></i> Manage Products</a></li>
            <li><a href="#"><i class="fas fa-shopping-bag"></i> Shop Now</a></li>
        </ul>
        <div class="sidebar-title">Dashboard</div>
        <div class="sidebar-title">Patient Management</div>
        <ul>
            <li><a href="#"><i class="fas fa-users"></i> Patients</a></li>
            <li><a href="#"><i class="fas fa-box"></i> Orders</a></li>
            <li><a href="#"><i class="fas fa-sync-alt"></i> Subscriptions</a></li>
        </ul>
        <div class="logout-container">
            <ul>
                <li><a href="#" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </div>
    </aside>

    <div class="main-container" id="main-container">
        <main class="content">
            <div class="row" data-sf-element="Row">
                <div class="sf_colsIn col-lg-12" data-sf-element="Column 1" data-placeholder-label="Column 1">
                </div>
            </div>
        </main>
    </div>

    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('sidebar-open');
    }
    document.addEventListener('click', function (event) {
        const sidebar = document.getElementById('sidebar');
        const mobileHeader = document.getElementById('mobile-header');
        if (!sidebar.contains(event.target) && !mobileHeader.contains(event.target) && sidebar.classList.contains('sidebar-open')) {
            sidebar.classList.remove('sidebar-open');
        }
    });
    </script>
</body>
</html>
