<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="../Content/fontawesome-free-5.15.4-web/css/all.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <style>

        .search-input-container {
            position: relative;
            width: 350px;
            color: #262626;
            padding: 10px 20px 10px 20px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
        }

        .search-input {
            width: 295px;
            border: none;
        }

            .search-input:focus {
                outline: none;
            }

        .search-terms {
            top: 15px;
            position: absolute;
            right: 15px;
            display: block;
            z-index: 10;
            color: #cad4d8;
        }

        .switch-check-archpatcolor:checked {
            background-color: #4890a6;
            border-color: #4890a6;
        }

        .orders-border {
            border: 1px solid #d8d8d8;
            border-radius: 8px;
        }

        /*need to fix for mobile*/
        .orders-table {
            overflow: auto;
            border-collapse: separate;
        }

            .orders-table td, th {
                padding-top: 25px;
                padding-bottom: 25px;
            }

            .orders-table tr:last-child td {
                border-bottom: none;
                padding-bottom: 0px;
            }


        .table-header-arrows-container {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
        }

        .table-header-arrow {
            font-size: 9px !important;
            font-weight: bold !important;
            opacity: 0.6
        }

        .table-header-arrow-active {
            opacity: 1
        }

        .circle-color {
            background-color: #f3f7fa;
            border: 1px solid #f3f7fa;
        }

        .btn-pd1 {
            color: #fff;
            background-color: #1a4363;
            border-color: #1a4363;
        }

            .btn-pd1:hover {
                color: #fff;
                background-color: #25608d;
                border-color: #1a4363;
            }

        .btn-outline-pd1 {
            color: #1a4363;
            border-color: #1a4363;
        }

            .btn-outline-pd1:hover {
                color: #fff;
                background-color: #1a4363;
                border-color: #1a4363;
            }
    </style>
</head>
<body>

    <div class="container">
        <div class="d-flex flex-column">
            <div class="d-flex flex-row justify-content-between my-3">
                <div class="search-input-container">
                    <input type="text" class="search-input" name="name" value="" placeholder="Patient or email" />
                    <span class="search-terms fas fa-search"></span>
                </div>
                <div><button class="btn btn-pd1">Add Patient</button></div>
            </div>

            <div class="form-check form-switch my-3">
                <input class="form-check-input switch-check-archpatcolor" type="checkbox" role="switch" id="archived-patients">
                <label class="form-check-label" style="color: #434d56;" for="archived-patients">Archived Patients</label>
            </div>

            <div class="d-flex flex-column align-items-center orders-border p-4 my-3">
                <div class="circle-color rounded-circle p-3"><i class="fas fa-users"></i></div>
                <div>No patients</div>
            </div>


            <div class="d-flex flex-column align-items-center orders-border p-4 my-3">
                <table class="table orders-table">
                    <thead>
                        <tr>
                            <th scope="col">
                                <b>Patient</b>
                                <span class="table-header-arrows-container ps-2 pe-1">
                                    <i class="fas fa-chevron-up table-header-arrow patientnameasc"></i>
                                    <i class="fas fa-chevron-down table-header-arrow patientnamedesc"></i>
                                </span>
                            </th>
                            <th scope="col">
                                <b>Date added</b>
                                <span class="table-header-arrows-container ps-2 pe-1">
                                    <i class="fas fa-chevron-up table-header-arrow dateaddedasc"></i>
                                    <i class="fas fa-chevron-down table-header-arrow dateaddeddesc"></i>
                                </span>
                            </th>
                            <th scope="col">
                                <b>Orders</b>
                                <span class="table-header-arrows-container ps-2 pe-1">
                                    <i class="fas fa-chevron-up table-header-arrow orderscountasc"></i>
                                    <i class="fas fa-chevron-down table-header-arrow orderscountdesc"></i>
                                </span>
                            </th>
                            <th scope="col">
                                <b>Subscriptions</b>
                                <span class="table-header-arrows-container ps-2 pe-1">
                                    <i class="fas fa-chevron-up table-header-arrow subscriptionscountasc"></i>
                                    <i class="fas fa-chevron-down table-header-arrow subscriptionscountdesc"></i>
                                </span>
                            </th>
                            <th scope="col">Acount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>

                                    <div>
                                        <div>Steve Miazga</div>

                        </tr>
                        <tr>

                                    <div class="me-3"><span class="circle-color rounded-circle p-3">SM</span></div>
                                    <div>

                                    <div class="me-3"><span class="circle-color rounded-circle p-3">SM</span></div>
                                    <div>
                                        <div>Steve Miazga</div>
                                        <div>s.miazga@ompimail.com</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                Jan 2nd 2025
                            </td>

                                3
                            </td>
                            <td>
                                <button class="btn btn-outline-pd1">Details</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>



        </div>
    </div>

</body>
